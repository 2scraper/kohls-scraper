name: Site changed / selectors broke
description: kohls.com changed something and the parser no longer matches.
labels: ["site-change"]
body:
  - type: markdown
    attributes:
      value: |
        This is the most common way a scraper stops working, and it is worth its
        own report because the fix is different from a code bug: something on
        kohls.com moved.

        Useful to know before filing: the parser reads the listing's **Astro
        island** (`catalogData` in an `<astro-island props="…">`) first, and a
        URL-pattern fallback over the rendered tiles second. The log says which
        (`source: catalog` or `source: dom`). Which one broke narrows the fix.

  - type: dropdown
    id: what_broke
    attributes:
      label: What stopped matching
      options:
        - Products (0 rows on a page that visibly has products)
        - A specific field is null or wrong (price, sku, image, URL)
        - The log says `source: dom` on a page that used to say `catalog`
        - Pagination stops early or repeats a page
        - The captcha detector finds nothing on a page that has one
        - Something else
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL
      description: The exact listing URL, and how the page was reached (--cdp-endpoint, a proxy, neither).
      placeholder: "https://www.kohls.com/catalog/cuisinart.jsp?CN=Brand:Cuisinart (over --cdp-endpoint, country-us)"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence from the page
      description: |
        Whichever of these you can get. A capture beats a description.

        - Whether the island is still there, from a `--dump-html dump.html` run:
          `python3 -c "import product_parser as p;d=p.catalog_data(open('dump.html').read());print(d and (len(d['products']), d['currentPage'], d['totalPages']))"`
        - Or paste one entry of `catalogData.products` from devtools.
        - For a field problem: the value you got, and the value on the page.
      render: text
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: >-
        Whether it reproduces on a second engine, whether it reproduces from a
        different country, and when it last worked.
